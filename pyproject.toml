[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse"
version = "0.3.0"
description = "A composable agent framework: build agents once, call them anywhere — in-process, over the network, or agent-to-agent."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["agent", "llm", "ai", "a2a", "claude", "anthropic", "framework"]
authors = [{ name = "synapse contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# The core framework is dependency-free (stdlib only) so it stays embeddable.
# LLM backends are optional extras.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
server = ["uvicorn>=0.23"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "ruff>=0.4", "uvicorn>=0.23"]

[project.scripts]
synapse = "synapse.cli:main"

[project.urls]
Homepage = "https://github.com/dreambe/synapse"
Repository = "https://github.com/dreambe/synapse"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
